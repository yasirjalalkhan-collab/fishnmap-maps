name: Seamark survey (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [survey/**, .github/workflows/seamark-survey.yml]
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 survey/seamarks.py
