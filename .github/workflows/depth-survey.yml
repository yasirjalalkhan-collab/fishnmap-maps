name: Depth data survey (one-off)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [survey/**, .github/workflows/depth-survey.yml]

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy python3-matplotlib > /dev/null
          gdalinfo --version

      - name: Survey
        run: /usr/bin/python3 survey/depth_survey.py out

      - uses: actions/upload-artifact@v4
        with:
          name: depth-survey
          path: out/*.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: depth-survey-maps
          path: out/*.png
          if-no-files-found: warn
